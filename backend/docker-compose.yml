version: "3.9"

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    env_file:
      - ./user-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Keeps http://auth-service:5001 in existing .env.docker files working.
    networks:
      default:
        aliases:
          - auth-service
    expose:
      - "5001"
    depends_on:
      - mongodb
      - redis

  hackathon-service:
    build:
      context: ./hackathon-service
    env_file:
      - ./hackathon-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "5002"
    depends_on:
      - mongodb
      - redis

  admin-service:
    build:
      context: ./admin-service
    env_file:
      - ./admin-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "5006"
    depends_on:
      - mongodb

  media-service:
    build:
      context: ./media-service
    env_file:
      - ./media-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "5003"
    depends_on:
      - mongodb

  notification-service:
    build:
      context: ./notification-service
    env_file:
      - ./notification-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "5004"
    depends_on:
      - mongodb
      - redis

  chatbot-service:
    build:
      context: ./chatbot-service
    env_file:
      - ./chatbot-service/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "5005"

  api-gateway:
    build:
      context: ./api-gateway
    env_file:
      - ./api-gateway/.env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - user-service
      - hackathon-service
      - admin-service
      - media-service
      - notification-service
      - chatbot-service

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway
      - user-service
      - hackathon-service
      - admin-service
      - media-service
      - notification-service
      - chatbot-service

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
