events {}

http {

    # api-gateway runs as several copies; Docker's DNS returns every copy's
    # address and nginx spreads requests across them. The periodic reload in
    # docker-compose.prod.yml re-resolves the name after a redeploy.
    upstream gateway {
        server api-gateway:5000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    upstream grafana {
        server grafana:3000;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name rahul1901.prometeo.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {

        listen 443 ssl http2;
        server_name rahul1901.prometeo.in;

        ssl_certificate /etc/letsencrypt/live/rahul1901.prometeo.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rahul1901.prometeo.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 100M;

        # Grafana — same domain, no separate DNS record or certificate
        # needed. Grafana itself still gates access with its own login.
        location /grafana/ {
            proxy_pass http://grafana;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Grafana's live dashboard updates run over a websocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {

            proxy_pass http://gateway;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # nginx's 60s default would cut off large uploads before the
            # gateway's own 120s proxy timeout to media-service kicks in.
            # If one copy is down or restarting, retry the request on another.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}