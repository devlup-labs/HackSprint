name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: true
          script: |
            whoami
            hostname
            pwd
            ls -la ~

            cd ~/distributedSystem

            git fetch origin
            git reset --hard origin/main

            cd backend

            cat > user-service/.env.docker << 'EOF'
            ${{ secrets.AUTH_ENV }}
            EOF

            cat > admin-service/.env.docker << 'EOF'
            ${{ secrets.ADMIN_ENV }}
            EOF

            cat > hackathon-service/.env.docker << 'EOF'
            ${{ secrets.HACKATHON_ENV }}
            EOF

            cat > media-service/.env.docker << 'EOF'
            ${{ secrets.MEDIA_ENV }}
            EOF

            cat > notification-service/.env.docker << 'EOF'
            ${{ secrets.NOTIFICATION_ENV }}
            EOF

            cat > chatbot-service/.env.docker << 'EOF'
            ${{ secrets.CHATBOT_ENV }}
            EOF

            cat > api-gateway/.env.docker << 'EOF'
            ${{ secrets.API_GATEWAY_ENV }}
            EOF

            cat > grafana/.env.docker << 'EOF'
            ${{ secrets.GRAFANA_ENV }}
            EOF

            # Build first, then replace containers in place. Without a full
            # `down`, the copies of a scaled service are swapped one by one, so
            # nginx always has a healthy copy to send traffic to.
            docker compose -f docker-compose.prod.yml build

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -af